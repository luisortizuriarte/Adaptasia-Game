<canvas id="game"></canvas>
<script>
'use strict';
/* =====================================================================
   ADAPTASIA (beta): an educational climate-adaptation city builder.
   Single file, HTML5 Canvas + vanilla JS, no external assets.
   Modules (in order): CONFIG, UTIL, MAP, SIMULATION, HAZARDS,
   SPRITES, RENDER, UI, BOOT.
   Tip: open with ?debug=1 in the URL (or set DEBUG = true) for test tools.
   ===================================================================== */

/* =====================================================================
   MODULE: CONFIG  (all balancing numbers live here)
   ===================================================================== */
let DEBUG = false;   // true = tile values (E=elev top-left, heat bottom-right, flood risk bottom-left; V toggles) + FLOOD!/HEAT!/+10K buttons (keys F / H)
try { if (/debug=1/.test(location.search)) DEBUG = true; } catch (e) {}

const CONFIG = {
  W: 640, H: 448, TILE: 16, COLS: 32, ROWS: 24, MAP_X: 124, MAP_Y: 30,
  startBudget: 25000,
  maxYears: 30,
  winPop: 5000, winResilience: 70,
  loseHappiness: 20, loseHappyYears: 3,
  bankruptYears: 3,            // in the red at the end of this many years in a row = bankrupt
  autoSeconds: 5,
  hillCostMult: 1.5,           // zones/roads on hills cost more (but hills rarely flood)

  econ:   { taxPerResident: 2.5, taxPerJob: 2, workerShare: 0.6 },
  growth: { migrationBase: 150, migrationRate: 0.08, maxFactor: 1.0, shrink: 0.3, roadReach: 2 },

  flood: {
    baseChance: 0.30, chanceTrend: 0.015, maxChance: 0.75,   // yearly probability
    sevMin: 0.4, sevRange: 0.6, sevTrend: 0.045,             // severity = (min + rnd*range) * (1 + trend*year)
    extremeChance: 0.05, extremeTrend: 0.007, extremeMult: 1.5,   // extreme odds rise each year
    levelBase: 0.05, levelPerSev: 0.22,                      // water level (elevation units) = base + per*severity
    designSev: 1.0,                                          // "design flood" used for the risk map & resilience
    damageDepth: 0.05,                                       // depth that counts as flooding a building
    popLossPerDepth: 2.0,
    abandonCount: 2, abandonWindow: 3,                       // floods twice in 3 years = abandoned
    leveeSurge: 0.12,                                        // extra depth when a levee fails
    nbsCap: 0.20,                                            // max flood reduction from nature on one tile (soil saturates)
    grayCap: 0.20,                                           // max flood reduction from drains on one tile
  },
  heat: {
    baseChance: 0.25, chanceTrend: 0.02, maxChance: 0.80,
    intMin: 0.6, intRange: 0.4, intTrend: 0.03,
    baseTile: 0.25, waterCool: 0.06,
    harmThreshold: 0.40, harmK: 0.35,
  },
  resilience: { wProtected: 0.40, wHeat: 0.35, wAvoided: 0.25, heatLow: 0.35, heatHigh: 0.80 },

  /* Item stats: cost, upkeep (per year), flood (reduction in depth; for levee = protection threshold),
     heatRed (heat reduction; negative = adds heat), rec (recreation), attr (attractiveness),
     mature (years to full effect), fail (failure chance in EXTREME events), radius (tiles),
     lv (land-value boost), dmg ($ damage per 1.0 flood depth). */
  items: {
    inspect:  { name: 'Inspect',  cat: 'tool', cost: 0,
                desc: 'Click a tile to see its details.' },
    demolish: { name: 'Demolish', cat: 'tool', cost: 20,
                desc: 'Clear a tile. Abandoned buildings must be cleared before rebuilding.' },

    road: { name: 'Road', cat: 'dev', cost: 60, upkeep: 3, flood: 0, heatRed: -0.06, rec: 0, attr: 0, mature: 0, fail: 0, radius: 0, lv: 0, dmg: 500,
            desc: 'Zones need a road within 2 tiles to grow.',
            fact: 'Pavement absorbs the sun all day and releases heat at night, warming nearby blocks.' },
    res:  { name: 'Residential', cat: 'dev', cost: 300, upkeep: 0, flood: 0, heatRed: -0.05, rec: 0, attr: 0, mature: 0, fail: 0, radius: 0, lv: 0, dmg: 2000, cap: 80,
            desc: 'Homes. Every resident pays tax. Grows faster with jobs, parks and low risk.',
            fact: 'Where we build matters: homes on high ground avoid most flood losses.' },
    com:  { name: 'Commercial', cat: 'dev', cost: 400, upkeep: 0, flood: 0, heatRed: -0.08, rec: 0, attr: 0, mature: 0, fail: 0, radius: 0, lv: 0.02, dmg: 2500, jobs: 60,
            desc: 'Shops and offices. Adds jobs and tax.',
            fact: 'Jobs nearby draw new residents and keep people from leaving.' },

    levee: { name: 'Levee/Seawall', cat: 'gray', cost: 3000, upkeep: 250, flood: 0.40, heatRed: -0.03, rec: 0, attr: -3, mature: 0, fail: 0.15, radius: 2, lv: -0.04, dmg: 0,
             desc: 'Blocks floods within 2 tiles up to a set depth. Overtopped or breached in extreme floods.',
             fact: "Levees can create a false sense of safety: building grows behind them, so a failure causes bigger losses (the 'levee effect')." },
    drain: { name: 'Storm Drain', cat: 'gray', cost: 1500, upkeep: 80, flood: 0.10, heatRed: 0, rec: 0, attr: 0, mature: 0, fail: 0.25, radius: 3, lv: 0, dmg: 1000,
             desc: 'Lowers flood depth within 3 tiles. Can clog in extreme storms.',
             fact: 'Storm drains are sized for a design storm. Heavier downpours overwhelm them.' },
    cool:  { name: 'Cooling Center', cat: 'gray', cost: 2000, upkeep: 150, flood: 0, heatRed: 0, rec: 0, attr: 1, mature: 0, fail: 0, radius: 4, lv: 0.01, dmg: 1000, harmCut: 0.6,
             desc: 'Cuts heat-wave harm within 4 tiles by 60%. Does not lower temperatures.',
             fact: 'Cooling centers save lives in heat waves, especially for older adults and people without air conditioning.' },

    wetland: { name: 'Wetland', cat: 'nature', cost: 500, upkeep: 10, flood: 0.14, heatRed: 0.12, rec: 6, attr: 4, mature: 3, fail: 0, radius: 3, lv: 0.06, dmg: 0, only: 'flood',
               desc: 'Floodplain tiles only. Soaks up floodwater within 3 tiles. Full effect after 3 years.',
               fact: 'Wetlands work like sponges: one acre can store over a million gallons of floodwater.' },
    park:    { name: 'Park/Trees', cat: 'nature', cost: 350, upkeep: 15, flood: 0.03, heatRed: 0.20, rec: 10, attr: 3, mature: 2, fail: 0, radius: 0, lv: 0.08, dmg: 0,
               desc: 'Trees cool the area and add recreation and land value.',
               fact: 'Shade trees can keep surfaces many degrees cooler than bare pavement.' },
    roof:    { name: 'Green Roof', cat: 'nature', cost: 200, upkeep: 5, flood: 0.03, heatRed: 0.08, rec: 1, attr: 1, mature: 1, fail: 0, radius: 0, lv: 0.03, dmg: 0,
               desc: 'Upgrade a zone: a little cooling, stormwater storage and happiness.',
               fact: 'Green roofs soak up rainfall and stay much cooler than dark roofs in summer.' },
    swale:   { name: 'Bioswale', cat: 'nature', cost: 120, upkeep: 3, flood: 0.05, heatRed: 0.03, rec: 1, attr: 1, mature: 1, fail: 0, radius: 1, lv: 0.02, dmg: 0,
               desc: 'Cheap planted channel that soaks up runoff within 1 tile.',
               fact: 'Bioswales slow and filter stormwater so it soaks into the ground instead of flooding streets.' },
  },
};

/* Short educational facts used in events (15). */
const FACTS = {
  floodplain: "Floodplains are where rivers naturally spread out. Building there puts people in harm's way.",
  downpours: 'Climate change is making heavy downpours more frequent and intense in many regions.',
  mitigation: 'Studies of U.S. hazard mitigation find each $1 invested saves about $6 in future disaster costs, on average.',
  neighbors: 'Seawalls and levees protect what is behind them but can push water and erosion onto neighbors.',
  levee: CONFIG.items.levee.fact,
  wetland: CONFIG.items.wetland.fact,
  drain: CONFIG.items.drain.fact,
  mature: 'Natural systems keep improving as they mature, while concrete slowly wears out.',
  saturate: 'Soils and wetlands can only hold so much. In the largest floods they fill up and water passes through.',
  heatDeadly: 'Heat is one of the deadliest weather hazards, often causing more deaths than floods or hurricanes.',
  island: 'Paved surfaces and dark roofs make cities warmer than the countryside: the urban heat island effect.',
  canopy: 'Tree canopy shades streets and cools the air as leaves release water.',
  cooling: CONFIG.items.cool.fact,
  greenroof: CONFIG.items.roof.fact,
  inequity: 'The hottest neighborhoods are often the ones with the least tree cover.',
};

/* =====================================================================
   MODULE: UTIL
   ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const idx = (x, y) => y * CONFIG.COLS + x;
const inB = (x, y) => x >= 0 && y >= 0 && x < CONFIG.COLS && y < CONFIG.ROWS;
const isWaterT = t => t.t === 'river' || t.t === 'sea';
const fmt = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
/** Visit every tile within Chebyshev radius r of (x,y): fn(index, distance, nx, ny) */
function forRadius(x, y, r, fn) {
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const nx = x + dx, ny = y + dy;
    if (inB(nx, ny)) fn(idx(nx, ny), Math.max(Math.abs(dx), Math.abs(dy)), nx, ny);
  }
}
/** Maturity multiplier: 25% when new, 100% after item.mature years. */
function eff(item, age) { return item.mature ? 0.25 + 0.75 * Math.min(1, age / item.mature) : 1; }

/* =====================================================================
   MODULE: MAP  (procedural terrain: coast, river, floodplain, hills)
   ===================================================================== */
function newTile() {
  return { t: 'land', e: 0, v: 0, b: null, age: 0, pop: 0, jobs: 0, roof: false, roofAge: 0, ab: false,
           fh: [], heat: 0, lv: 0, risk: 0, rawRisk: 0, cooled: 0, fx: 0, hx: 0, dmgYear: -9, scar: false };
}
function valueNoise(rnd, gw, gh) {
  const g = []; for (let i = 0; i < (gw + 1) * (gh + 1); i++) g.push(rnd());
  const s = t => t * t * (3 - 2 * t);
  return (u, v) => {
    const fx = u * gw, fy = v * gh, ix = Math.min(gw - 1, fx | 0), iy = Math.min(gh - 1, fy | 0);
    const tx = s(fx - ix), ty = s(fy - iy), at = (a, b) => g[b * (gw + 1) + a];
    const a = at(ix, iy) + (at(ix + 1, iy) - at(ix, iy)) * tx;
    const b = at(ix, iy + 1) + (at(ix + 1, iy + 1) - at(ix, iy + 1)) * tx;
    return a + (b - a) * ty;
  };
}
function generateMap(seed) {
  const C = CONFIG, rnd = mulberry32(seed), N = C.COLS * C.ROWS, T = [];
  for (let i = 0; i < N; i++) { const t = newTile(); t.v = (rnd() * 4) | 0; T.push(t); }
  // Coastline along the bottom edge
  const ph = rnd() * 6.28;
  for (let x = 0; x < C.COLS; x++) {
    const d = clamp(Math.round(2.5 + 1.5 * Math.sin(x * 0.35 + ph) + rnd() * 0.8), 1, 5);
    for (let y = C.ROWS - d; y < C.ROWS; y++) T[idx(x, y)].t = 'sea';
  }
  // Meandering river from the top edge to the sea
  let x = 8 + ((rnd() * 16) | 0), dir = 0;
  for (let y = 0; y < C.ROWS; y++) {
    if (T[idx(x, y)].t === 'sea') break;
    T[idx(x, y)].t = 'river';
    if (y > C.ROWS * 0.45 && T[idx(x + 1, y)].t !== 'sea') T[idx(x + 1, y)].t = 'river'; // wider downstream
    let step = rnd() < 0.5 ? 0 : (rnd() < 0.5 ? -1 : 1);
    if (rnd() < 0.55) step = dir; dir = step;
    const nx = clamp(x + step, 3, C.COLS - 5);
    if (nx !== x && T[idx(nx, y)].t !== 'sea') T[idx(nx, y)].t = 'river';
    x = nx;
  }
  // Distance to water (BFS)
  const dist = new Array(N).fill(99), q = [];
  T.forEach((t, i) => { if (isWaterT(t)) { dist[i] = 0; q.push(i); } });
  for (let h = 0; h < q.length; h++) {
    const i = q[h], cx = i % C.COLS, cy = (i / C.COLS) | 0;
    for (const [dx, dy] of DIR4) { const nx = cx + dx, ny = cy + dy; if (!inB(nx, ny)) continue; const j = idx(nx, ny); if (dist[j] > dist[i] + 1) { dist[j] = dist[i] + 1; q.push(j); } }
  }
  // Elevation = distance from water + noise
  const n1 = valueNoise(rnd, 4, 3), n2 = valueNoise(rnd, 9, 7);
  T.forEach((t, i) => {
    if (isWaterT(t)) { t.e = 0; return; }
    const u = (i % C.COLS) / C.COLS, v = ((i / C.COLS) | 0) / C.ROWS;
    const n = 0.7 * n1(u, v) + 0.3 * n2(u, v);
    t.e = clamp(0.02 + 0.55 * Math.min(1, dist[i] / 9) + 0.45 * (n - 0.3), 0.04, 1);
  });
  // Classify: coastline sand, floodplain, hills
  T.forEach((t, i) => {
    if (isWaterT(t)) return;
    const cx = i % C.COLS, cy = (i / C.COLS) | 0;
    const nearSea = DIR4.some(([dx, dy]) => inB(cx + dx, cy + dy) && T[idx(cx + dx, cy + dy)].t === 'sea');
    if (nearSea) { t.t = 'sand'; t.e = Math.min(t.e, 0.12); }
    else if (t.e < 0.22 && dist[i] <= 4) t.t = 'flood';
    else if (t.e > 0.72) t.t = 'hill';
  });
  return T;
}

/* =====================================================================
   MODULE: SIMULATION  (state, placement, derived maps, yearly update)
   ===================================================================== */
function newState(seed) {
  seed = seed == null ? (Math.random() * 1e9) | 0 : seed;
  const st = {
    version: 1, seed, year: 1, budget: CONFIG.startBudget, pop: 0, jobsCap: 0, filledJobs: 0, jobFactor: 0.5,
    happiness: 60, happyTarget: 60, resilience: 50, recreation: 0, attract: 50,
    protectedShare: 1, heatScore: 1, avgHeat: 0, floodShock: 0,
    tiles: generateMap(seed),
    stats: { gray: 0, nbs: 0, dev: 0, damage: 0, avoided: 0, floods: 0, heatwaves: 0, leveeFails: 0, heatLoss: 0, floodLoss: 0, abandoned: 0 },
    recent: [], disasters: [], hist: [], lowHappy: 0, redYears: 0, over: false, result: null,
  };
  recomputeAll(st);
  st.forecast = rollForecast(st);
  return st;
}
function addSpend(st, cat, amt) {
  if (cat === 'gray') st.stats.gray += amt; else if (cat === 'nature') st.stats.nbs += amt; else st.stats.dev += amt;
}
function roadAccessMap(st) {
  const C = CONFIG, m = new Uint8Array(st.tiles.length);
  st.tiles.forEach((t, i) => { if (t.b === 'road') forRadius(i % C.COLS, (i / C.COLS) | 0, C.growth.roadReach, j => (m[j] = 1)); });
  return m;
}

/** Can `tool` be used at (x,y)? Returns {ok, cost, reason}. */
function canPlace(st, tool, x, y) {
  const C = CONFIG, t = st.tiles[idx(x, y)], it = C.items[tool];
  if (st.over) return { ok: false, reason: 'GAME OVER - START A NEW GAME' };
  if (tool === 'inspect') return { ok: true, cost: 0 };
  if (tool === 'demolish') {
    if (!t.b && !t.roof) return { ok: false, reason: 'NOTHING TO DEMOLISH' };
    if (st.budget < it.cost) return { ok: false, reason: 'NOT ENOUGH MONEY', cost: it.cost };
    return { ok: true, cost: it.cost };
  }
  if (isWaterT(t)) return { ok: false, reason: 'CANNOT BUILD ON WATER' };
  let cost = it.cost;
  if (tool === 'roof') {
    if (!(t.b === 'res' || t.b === 'com') || t.ab) return { ok: false, reason: 'GREEN ROOFS GO ON A RESIDENTIAL OR COMMERCIAL ZONE' };
    if (t.roof) return { ok: false, reason: 'ALREADY HAS A GREEN ROOF' };
  } else {
    if (t.b) return { ok: false, reason: 'TILE OCCUPIED - DEMOLISH FIRST' };
    if (it.only === 'flood' && t.t !== 'flood') return { ok: false, reason: 'WETLANDS CAN ONLY BE RESTORED ON FLOODPLAIN TILES' };
    if (t.t === 'hill' && it.cat === 'dev') cost = Math.round(cost * C.hillCostMult);
  }
  if (st.budget < cost) return { ok: false, reason: 'NOT ENOUGH MONEY', cost };
  return { ok: true, cost };
}
function place(st, tool, x, y) {
  const r = canPlace(st, tool, x, y);
  if (!r.ok || tool === 'inspect') return r;
  const t = st.tiles[idx(x, y)], it = CONFIG.items[tool];
  if (tool === 'demolish') {
    if (t.b) { t.b = null; t.pop = 0; t.jobs = 0; t.ab = false; t.fh = []; t.age = 0; }
    t.roof = false; t.scar = false; addSpend(st, 'dev', r.cost);
  } else if (tool === 'roof') { t.roof = true; t.roofAge = 0; addSpend(st, 'nature', r.cost); }
  else { t.b = tool; t.age = 0; t.pop = 0; t.jobs = 0; t.ab = false; t.fh = []; t.scar = false; addSpend(st, it.cat, r.cost); }
  st.budget -= r.cost;
  recomputeAll(st);
  return r;
}

/** Heat-island score per tile (0..1): pavement & buildings warm, trees, parks, wetlands & water cool. */
function computeHeat(st) {
  const C = CONFIG, T = st.tiles, H = C.heat, W = [1, 0.5, 0.2];
  const src = new Float32Array(T.length), cool = new Uint8Array(T.length);
  T.forEach((t, i) => {
    let s = isWaterT(t) ? H.waterCool : 0;
    if (t.b) { const it = C.items[t.b]; s += (it.heatRed || 0) * eff(it, t.age); }
    if (t.roof) s += C.items.roof.heatRed * eff(C.items.roof, t.roofAge);
    src[i] = s;
    if (t.b === 'cool') forRadius(i % C.COLS, (i / C.COLS) | 0, C.items.cool.radius, j => (cool[j] = 1));
  });
  T.forEach((t, i) => {
    let h = H.baseTile + (t.t === 'hill' ? -0.03 : 0);
    forRadius(i % C.COLS, (i / C.COLS) | 0, 2, (j, d) => { h -= src[j] * W[d]; });
    t.heat = clamp(h, 0, 1); t.cooled = cool[i];
  });
}

/** Flood depth for a water `level`. mode 'event' rolls failures; 'preview' is deterministic. */
function floodDepths(st, level, mode, extreme) {
  const C = CONFIG, F = C.flood, I = C.items, T = st.tiles, N = T.length;
  const raw = new Float32Array(N), seen = new Uint8Array(N), q = [];
  T.forEach((t, i) => { if (isWaterT(t)) { seen[i] = 1; q.push(i); } });
  while (q.length) { // water spreads from river & sea into connected low tiles
    const i = q.pop(), x = i % C.COLS, y = (i / C.COLS) | 0;
    for (const [dx, dy] of DIR4) {
      const nx = x + dx, ny = y + dy; if (!inB(nx, ny)) continue;
      const j = idx(nx, ny); if (seen[j]) continue;
      if (T[j].e < level) { seen[j] = 1; raw[j] = level - T[j].e; q.push(j); }
    }
  }
  const nbs = new Float32Array(N), gray = new Float32Array(N), clogged = [];
  T.forEach((t, i) => {
    const x = i % C.COLS, y = (i / C.COLS) | 0;
    if (t.b === 'drain') {
      if (mode === 'event' && extreme && Math.random() < I.drain.fail) { clogged.push(i); return; }
      forRadius(x, y, I.drain.radius, j => (gray[j] += I.drain.flood));
    } else if (t.b === 'wetland' || t.b === 'park' || t.b === 'swale') {
      const it = I[t.b], e = it.flood * eff(it, t.age);
      forRadius(x, y, it.radius, j => (nbs[j] += e));
    }
    if (t.roof) nbs[i] += I.roof.flood * eff(I.roof, t.roofAge);
  });
  const net = new Float32Array(N);
  for (let i = 0; i < N; i++) net[i] = Math.max(0, raw[i] - Math.min(F.nbsCap, nbs[i]) - Math.min(F.grayCap, gray[i]));
  // Levees: protect covered tiles up to the threshold; overtopping or breach = failure + surge
  const failed = [], protect = new Uint8Array(N), hit = new Uint8Array(N);
  T.forEach((t, i) => {
    if (t.b !== 'levee') return;
    const x = i % C.COLS, y = (i / C.COLS) | 0; let wet = false, over = false;
    forRadius(x, y, I.levee.radius, j => { if (net[j] > 0.001) wet = true; if (net[j] > I.levee.flood) over = true; });
    const breach = mode === 'event' && extreme && wet && Math.random() < I.levee.fail;
    const fail = over || breach;
    if (fail) failed.push(i);
    forRadius(x, y, I.levee.radius, j => { if (fail) hit[j] = 1; else protect[j] = 1; });
  });
  for (let i = 0; i < N; i++) {
    if (net[i] <= 0) continue;
    if (protect[i] && net[i] <= I.levee.flood) net[i] = 0;
    else if (hit[i]) net[i] += F.leveeSurge;
  }
  return { raw, net, failed, clogged };
}
function levelFor(sev) { const F = CONFIG.flood; return F.levelBase + F.levelPerSev * sev; }
function designLevel(st) { const F = CONFIG.flood; return levelFor(F.designSev * (1 + F.sevTrend * st.year)); }
function computeRisk(st) {
  const r = floodDepths(st, designLevel(st), 'preview', false);
  st.tiles.forEach((t, i) => { t.risk = r.net[i]; t.rawRisk = r.raw[i]; });
}
/** Land value (0..1): parks, wetlands, water views and jobs raise it; risk, heat and walls lower it. */
function computeLandValue(st) {
  const C = CONFIG, T = st.tiles, W = [1, 1, 0.6, 0.3];
  const boost = new Float32Array(T.length);

  x += 150; text('HEAT', x, y0 + 2, PAL.orange); bar(x + 18, fc.hc, PAL.hot); text(`${Math.round(fc.hc * 100)}% ${heatLabel(fc)}`, x + 74, y0 + 2, heatLabel(fc) === 'SEVERE' ? PAL.red : PAL.white);
  // Hover info line
  let info = '';
  if (UI.hover) {
    const [hx, hy] = UI.hover, t = S.tiles[idx(hx, hy)];
    const tn = { land: 'LAND', river: 'RIVER', sea: 'SEA', sand: 'COAST', flood: 'FLOODPLAIN', hill: 'HILL' }[t.t];
    info = `${hx},${hy} ${tn}` + (t.b ? ' - ' + CONFIG.items[t.b].name + (t.b === 'res' ? ` (${t.pop})` : '') : '') +
      (isWaterT(t) ? '' : `  ELEV ${t.e.toFixed(2)}  HEAT ${t.heat.toFixed(2)}  VALUE ${t.lv.toFixed(2)}  RISK ${t.risk.toFixed(2)}`);
    if (UI.tool !== 'inspect') { const r = canPlace(S, UI.tool, hx, hy); info += r.ok ? `  BUILD $${fmt(r.cost)}` : '  ' + r.reason; }
  }
  text(info.slice(0, 128), x0, y0 + 13, PAL.white);
  if (now < UI.msgUntil) text(UI.msg.slice(0, 128), x0, y0 + 23, PAL.yellow);
}

function drawTooltip() {
  const b = UI.hoverBtn; if (!b || b.kind !== 'tool' || UI.popups.length) return;
  const it = CONFIG.items[b.id], lines = [];
  lines.push([it.name.toUpperCase() + (it.cost ? `  $${fmt(it.cost)}` + (it.upkeep ? ` (+$${it.upkeep}/YR)` : '') : ''), PAL.yellow]);
  wrap(it.desc, 42).forEach(l => lines.push([l, PAL.white]));
  itemEffects(b.id).forEach(e => lines.push([e, PAL.foam]));
  if (it.fact) wrap('FACT: ' + it.fact, 42).forEach(l => lines.push([l, PAL.pgreen]));
  const w = 178, h = lines.length * 7 + 8, x = b.x + b.w + 4, y = clamp(b.y, 30, CONFIG.H - h - 2);
  rect(x, y, w, h, PAL.ink); outline(x, y, w, h, PAL.yellow);
  lines.forEach(([s, c], k) => text(s, x + 4, y + 4 + k * 7, c));
}

function drawPopup() {
  const p = UI.popups[0]; if (!p) return; const C = CONFIG;
  ctx.globalAlpha = 0.5; rect(0, 0, C.W, C.H, PAL.ink); ctx.globalAlpha = 1;
  const w = p.w || 300, iconW = p.icon ? 42 : 0, maxCh = Math.floor((w - 20 - iconW) / 4);
  const body = [];
  (p.lines || []).forEach(l => { if (l === '') body.push(['', null]); else wrap(l, maxCh).forEach(s => body.push([s, l.startsWith('*') ? PAL.yellow : PAL.white])); });
  if (p.fact) { body.push(['', null]); wrap('DID YOU KNOW? ' + p.fact, maxCh).forEach(s => body.push([s, PAL.pgreen])); }
  const barsH = p.bars ? p.bars.length * 11 + 4 : 0;
  const h = Math.max(70, 36 + body.length * 8 + barsH + 24), x = ((C.W - w) / 2) | 0, y = Math.max(4, ((C.H - h) / 2) | 0);
  panel(x, y, w, h, p.border || PAL.yellow);
  if (p.icon) { rect(x + 8, y + 8, 36, 36, PAL.ink); ctx.drawImage(p.icon, x + 10, y + 10, 32, 32); }
  const tx = x + 12 + iconW; textS(p.title, tx, y + 10, PAL.yellow, 2);
  let ly = y + 28; body.forEach(([s, c]) => { if (c) text(s.replace(/^\*/, ''), tx, ly, c); ly += 8; });
  if (p.bars) { ly += 2; const max = Math.max(1, ...p.bars.map(b => b[1])); p.bars.forEach(([l, v, c]) => { text(l, tx, ly + 1, PAL.pale); rect(tx + 60, ly, 120, 7, PAL.ink); rect(tx + 61, ly + 1, 118 * v / max, 5, c); text('$' + fmt(v), tx + 186, ly + 1, PAL.white); ly += 11; }); }
  UI.popupBtns = []; let bx = x + w - 10;
  (p.buttons || [{ label: 'OK', act: () => {} }]).slice().reverse().forEach(b => {
    const bw = tw(b.label) + 14; bx -= bw; const by = y + h - 19;
    const hov = UI.mouse.x >= bx && UI.mouse.x < bx + bw && UI.mouse.y >= by && UI.mouse.y < by + 13;
    bevel(bx, by, bw, 13, hov ? PAL.hot : PAL.red); textS(b.label, bx + 7, by + 4, PAL.white);
    UI.popupBtns.push({ x: bx, y: by, w: bw, h: 13, act: b.act }); bx -= 6;
  });
}

function draw(now) {
  ctx.imageSmoothingEnabled = false;
  rect(0, 0, CONFIG.W, CONFIG.H, PAL.ink);
  drawMap(now); drawHUD(); drawPanel(now); drawBottom(now); drawTooltip(); drawPopup();
}

/* =====================================================================
   MODULE: UI  (input, buttons, popups, tutorial, save/load, report)
   ===================================================================== */
const UI = { tool: 'inspect', overlay: null, auto: false, lastAuto: 0, hover: null, hoverBtn: null, popups: [], popupBtns: [],
  inspect: null, dbgValues: true, msg: '', msgUntil: 0, mouse: { x: -1, y: -1, down: false }, lastPaint: -1, fxFlood: -1e9, fxHeat: -1e9, buttons: [] };
const SAVE_KEY = 'adaptasia_save_v1', TUT_KEY = 'adaptasia_tutorial_seen';

function buildButtons() {
  const B = [], row = (ids, y) => ids.forEach((id, k) => B.push({ x: 4 + k * 28, y, w: 24, h: 24, kind: 'tool', id }));
  row(['inspect', 'demolish'], 38); row(['road', 'res', 'com'], 74); row(['levee', 'drain', 'cool'], 110); row(['wetland', 'park', 'roof', 'swale'], 146);
  ['flood', 'heat', 'value'].forEach((id, k) => B.push({ x: 4 + k * 38, y: 184, w: 36, h: 13, kind: 'overlay', id, label: id.toUpperCase() }));
  B.push({ x: 4, y: 356, w: 112, h: 20, kind: 'action', id: 'end', label: 'END YEAR' });
  B.push({ x: 4, y: 380, w: 112, h: 12, kind: 'action', id: 'speed', label: '' });
  ['SAVE', 'LOAD', 'NEW', 'HELP'].forEach((l, k) => B.push({ x: 4 + k * 28, y: 396, w: 26, h: 12, kind: 'action', id: l.toLowerCase(), label: l }));
  if (DEBUG) ['FLOOD!', 'HEAT!', '+10K'].forEach((l, k) => B.push({ x: 4 + k * 38, y: 412, w: 36, h: 12, kind: 'debug', id: ['dflood', 'dheat', 'dmoney'][k], label: l }));
  UI.buttons = B;
}
function flash(msg, ms = 3500) { UI.msg = msg; UI.msgUntil = performance.now() + ms; }
function btnAt(x, y) { return UI.buttons.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) || null; }
function tileAt(x, y) {
  const C = CONFIG, tx = Math.floor((x - C.MAP_X) / 16), ty = Math.floor((y - C.MAP_Y) / 16);
  return inB(tx, ty) && x >= C.MAP_X && y >= C.MAP_Y ? [tx, ty] : null;
}
function tryPlace(tx, ty) {
  if (UI.tool === 'inspect') { UI.inspect = idx(tx, ty); return; }
  const r = place(S, UI.tool, tx, ty);
  if (r.ok) flash(`${CONFIG.items[UI.tool].name.toUpperCase()}: -$${fmt(r.cost)}`, 1500);
  else flash(r.reason, 2500);
}
function onButton(b) {
  if (b.kind === 'tool') { UI.tool = b.id; UI.inspect = null; return; }
  if (b.kind === 'overlay') { UI.overlay = UI.overlay === b.id ? null : b.id; return; }
  switch (b.id) {
    case 'end': doEndYear(); break;
    case 'speed': UI.auto = !UI.auto; UI.lastAuto = performance.now(); break;
    case 'save': try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); flash('GAME SAVED.'); } catch (e) { flash('SAVE FAILED (STORAGE BLOCKED?)'); } break;
    case 'load': try { const d = localStorage.getItem(SAVE_KEY); if (!d) { flash('NO SAVED GAME FOUND.'); break; } S = JSON.parse(d); recomputeAll(S); UI.inspect = null; flash('GAME LOADED.'); } catch (e) { flash('LOAD FAILED.'); } break;
    case 'new': UI.popups.push({ title: 'NEW GAME?', icon: SPR.icWarn, lines: ['Start over on a new map? Unsaved progress will be lost.'],
      buttons: [{ label: 'CANCEL', act: () => {} }, { label: 'NEW MAP', act: () => { S = newState(); UI.inspect = null; UI.auto = false; } }] }); break;
    case 'help': showTutorial(); break;
    case 'dflood': { const r = applyFlood(S, S.forecast.sev * 1.3, false); UI.fxFlood = performance.now(); UI.popups.push(floodPopup(r, true)); break; }
    case 'dheat': { const r = applyHeat(S, S.forecast.inten * 1.2); UI.fxHeat = performance.now(); UI.popups.push(heatPopup(r, true)); break; }
    case 'dmoney': S.budget += 10000; flash('DEBUG: +$10,000'); break;
  }
}
function floodPopup(r, dbg) {
  const fact = r.failed ? FACTS.levee : r.extreme ? FACTS.saturate : S.tiles.some(t => t.b === 'wetland') ? FACTS.wetland
    : [FACTS.floodplain, FACTS.downpours, FACTS.mitigation, FACTS.neighbors, FACTS.drain, FACTS.mature][(Math.random() * 6) | 0];
  const L = [`The river and sea rose to level ${r.level.toFixed(2)}.` + (r.extreme ? ' An extreme event!' : '')];
  L.push(r.hit ? `${r.hit} buildings were damaged. Repairs cost $${fmt(r.dmg)}.` : 'No buildings were damaged.');
  if (r.avoided > 0) L.push(`*Your defenses avoided $${fmt(r.avoided)} in damage.`);
  if (r.popLost) L.push(`${fmt(r.popLost)} residents were displaced.`);
  if (r.aband) L.push(`${r.aband} buildings flooded twice in 3 years and were abandoned.`);
  if (r.failed) L.push(`*${r.failed} levee(s) were overtopped or breached and destroyed!`);
  if (r.clogged) L.push(`${r.clogged} storm drain(s) clogged with debris.`);
  return { title: (dbg ? 'DEBUG ' : '') + (r.extreme ? 'EXTREME FLOOD!' : 'FLOOD!'), icon: SPR.icWave, border: PAL.water, lines: L, fact };
}
function heatPopup(r, dbg) {
  const fact = r.cooledSaved > 0 ? FACTS.cooling : [FACTS.heatDeadly, FACTS.island, FACTS.canopy, FACTS.inequity, FACTS.greenroof][(Math.random() * 5) | 0];
  const L = [`A heat wave (intensity ${r.inten.toFixed(2)}) baked the city.`];
  L.push(r.lost ? `${fmt(r.lost)} residents fell ill or moved away from the ${r.hot} hottest blocks.` : 'Your neighborhoods stayed cool enough. No one left.');
  if (r.cooledSaved) L.push(`*Cooling centers protected about ${fmt(r.cooledSaved)} people.`);
  if (r.lost) L.push('Tip: check the HEAT overlay. Trees, wetlands and green roofs lower it.');
  return { title: (dbg ? 'DEBUG ' : '') + 'HEAT WAVE!', icon: SPR.icSun, border: PAL.hot, lines: L, fact };
}
function reportPopup() {
  const s = S.stats, R = { win: 'YOU WIN!', bankrupt: 'BANKRUPT', unhappy: 'RESIDENTS REVOLT', time: "TIME'S UP" }[S.result];
  const why = { win: `You reached ${fmt(S.pop)} people with resilience ${S.resilience}.`, bankrupt: 'The budget stayed in the red too long.',
    unhappy: 'Happiness stayed below 20% for 3 years.', time: `30 years passed. Goal: ${fmt(CONFIG.winPop)} people, resilience ${CONFIG.winResilience}+, budget $0+.` }[S.result];
  const les = lessons(S);
  return { title: R, icon: S.result === 'win' ? SPR.icTrophy : SPR.icWarn, w: 420, border: S.result === 'win' ? PAL.lgreen : PAL.red,
    lines: [why, `YEAR ${S.year - 1}  POP ${fmt(S.pop)}  BUDGET $${fmt(S.budget)}  HAPPY ${Math.round(S.happiness)}%  RESILIENCE ${S.resilience}`,
      `FLOODS ${s.floods}  HEAT WAVES ${s.heatwaves}  LEVEE FAILURES ${s.leveeFails}  ABANDONED ${s.abandoned}`,
      `DAMAGE TAKEN $${fmt(s.damage)}  DAMAGE AVOIDED $${fmt(s.avoided)}`, '', '*LESSONS LEARNED', ...les.map((l, k) => `${k + 1}. ${l}`), '', 'SPENDING (BUILD + UPKEEP):'],
    bars: [['GRAY', Math.round(s.gray), PAL.gray], ['NATURE', Math.round(s.nbs), PAL.lgreen], ['DEVELOPMENT', Math.round(s.dev), PAL.yellow]],
    buttons: [{ label: 'KEEP LOOKING', act: () => {} }, { label: 'NEW GAME', act: () => { S = newState(); UI.inspect = null; } }] };
}
function doEndYear() {
  if (!S || S.over || UI.popups.length) return;
  const rep = endYear(S); if (!rep) return;
  UI.lastAuto = performance.now();
  flash(`YEAR ${rep.year} DONE: TAXES +$${fmt(rep.taxes)}, UPKEEP -$${fmt(rep.upkeep)}.` + (!rep.flood && !rep.heat ? ' A CALM YEAR.' : ''), 7000);
  if (rep.flood) { UI.fxFlood = performance.now(); UI.popups.push(floodPopup(rep.flood)); }
  if (rep.heat) { UI.fxHeat = performance.now(); UI.popups.push(heatPopup(rep.heat)); }
  if (rep.warnBankrupt) UI.popups.push({ title: 'IN THE RED', icon: SPR.icWarn, lines: [`Your budget is below zero (year ${S.redYears} of ${CONFIG.bankruptYears}). Stay in the red ${CONFIG.bankruptYears} years running and the city goes bankrupt.`, 'Upkeep adds up: check what you can afford.'] });
  if (rep.warnHappy) UI.popups.push({ title: 'UNHAPPY CITY', icon: SPR.icWarn, lines: [`Happiness has been below 20% for ${S.lowHappy} year(s). Three in a row and residents revolt.`, 'Parks, jobs, cooler streets and fewer disasters help.'] });
  if (S.over) { UI.auto = false; UI.popups.push(reportPopup()); }
}
function showTutorial() {
  const pages = [
    { title: 'WELCOME!', icon: SPR.park[0], lines: ['You are the planner of a young river city. Grow it to 5,000 people within 30 years while keeping it safe from floods and heat.', '',
      '*WIN: population 5,000+, resilience 70+, and budget $0 or more.', `LOSE: in the red ${CONFIG.bankruptYears} years running, or happiness under 20% for 3 years in a row.`] },
    { title: 'BUILD', icon: SPR.res[1], lines: ['Lay ROADS first. Residential and commercial zones only grow within 2 tiles of a road. Drag to paint.', '',
      'Homes pay taxes; shops add jobs. Keep jobs and homes in balance.', '', 'When you are done, press END YEAR (or SPACE). Switch SPEED to AUTO to play a year every 5 seconds.'] },
    { title: 'HAZARDS', icon: SPR.icWave, lines: ['Each year may bring a FLOOD from the river and coast, or a citywide HEAT WAVE. Both grow more likely and stronger over time.', '',
      'Check the FORECAST at the bottom, and use the FLOOD, HEAT and VALUE overlays to see where risk is.', '', 'Low tiles near water flood first. A building that floods twice in 3 years is abandoned.'] },
    { title: 'GRAY OR GREEN?', icon: SPR.wetland[0], lines: ['GRAY (levees, drains, cooling centers): works at once and is reliable, but costly, adds no amenities, and can fail in extreme floods.', '',
      'NATURE (wetlands, parks, green roofs, bioswales): cheaper, matures over years, adds cooling, recreation and land value, but has limits.', '', '*The best cities usually mix both. Hover over any tool to learn more.'] },
  ];
  pages.forEach((pg, k) => { pg.title = `${k + 1}/4 ${pg.title}`; pg.buttons = k < 3 ? [{ label: 'SKIP', act: () => { UI.popups = UI.popups.filter(p => !p.tut); } }, { label: 'NEXT', act: () => {} }] : [{ label: "LET'S BUILD!", act: () => {} }]; pg.tut = true; pg.w = 320; });
  UI.popups.unshift(...pages);
  try { localStorage.setItem(TUT_KEY, '1'); } catch (e) {}
}
function toLocal(e) { const r = canvas.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * CONFIG.W, y: ((e.clientY - r.top) / r.height) * CONFIG.H }; }
function setupInput() {
  canvas.addEventListener('pointerdown', e => {
    const m = toLocal(e); UI.mouse = { ...m, down: true };
    if (UI.popups.length) {
      const b = UI.popupBtns.find(b => m.x >= b.x && m.x < b.x + b.w && m.y >= b.y && m.y < b.y + b.h);
      if (b) { UI.popups.shift(); b.act(); } return;
    }
    const btn = btnAt(m.x, m.y); if (btn) { onButton(btn); return; }
    const t = tileAt(m.x, m.y); if (t) { tryPlace(t[0], t[1]); UI.lastPaint = idx(t[0], t[1]); }
  });
  canvas.addEventListener('pointermove', e => {
    const m = toLocal(e); UI.mouse.x = m.x; UI.mouse.y = m.y;
    UI.hoverBtn = btnAt(m.x, m.y); UI.hover = tileAt(m.x, m.y);
    if (UI.mouse.down && UI.hover && !UI.popups.length && UI.tool !== 'inspect') {
      const i = idx(UI.hover[0], UI.hover[1]); if (i !== UI.lastPaint) { UI.lastPaint = i; tryPlace(UI.hover[0], UI.hover[1]); }
    }
  });
  window.addEventListener('pointerup', () => { UI.mouse.down = false; UI.lastPaint = -1; });
  canvas.addEventListener('pointerleave', () => { UI.hover = null; UI.hoverBtn = null; });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (UI.popups.length) UI.popups.shift(); else doEndYear(); }
    if (e.code === 'Escape') { UI.inspect = null; UI.tool = 'inspect'; }
    if (DEBUG && !UI.popups.length && e.key === 'f') onButton({ id: 'dflood' });
    if (DEBUG && !UI.popups.length && e.key === 'h') onButton({ id: 'dheat' });
    if (DEBUG && e.key === 'v') UI.dbgValues = !UI.dbgValues; // toggle tile value labels
  });
}
function resize() {
  const C = CONFIG, s = Math.min(window.innerWidth / C.W, window.innerHeight / C.H);
  const scale = s >= 1 ? Math.floor(s) : s; // integer scaling for pixel-perfect output
  canvas.style.width = C.W * scale + 'px'; canvas.style.height = C.H * scale + 'px';
}

/* =====================================================================
   MODULE: BOOT
   ===================================================================== */
function boot() {
  canvas = document.getElementById('game'); canvas.width = CONFIG.W; canvas.height = CONFIG.H;
  ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
  buildSprites(); buildButtons(); setupInput(); resize(); window.addEventListener('resize', resize);
  S = newState();
  let seen = false; try { seen = !!localStorage.getItem(TUT_KEY); } catch (e) {}
  if (!seen) showTutorial(); else flash('WELCOME BACK. PRESS HELP FOR THE TUTORIAL.', 5000);
  const loop = now => {
    if (UI.auto && !UI.popups.length && S && !S.over && now - UI.lastAuto > CONFIG.autoSeconds * 1000) doEndYear();
    draw(now); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
if (typeof document !== 'undefined' && document.getElementById('game')) boot();
if (typeof module !== 'undefined') module.exports = { CONFIG, newState, place, canPlace, endYear, recomputeAll, idx, inB, isWaterT, forRadius, levelFor, designLevel, lessons, roadAccessMap };
